<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vid Studio</title>
<style>
@font-face { font-family: "Instrument Sans"; src: url(/fonts/instrument-sans.woff2) format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(/fonts/ibm-plex-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(/fonts/ibm-plex-mono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #f8f8f6; --surface-2: #f1f1ee; --line: #ebebe8; --line-2: #dddcd8;
  --ink: #111110; --ink-2: #5a5853; --ink-3: #8f8c86;
  --primary: #111110; --primary-ink: #ffffff; --danger: #c2410c; --focus: #2563eb;
  --radius: 10px;
  --sans: "Instrument Sans", "Aptos", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(17,17,16,.06), 0 8px 24px rgba(17,17,16,.06);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; font-synthesis: none; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: #dbe7fb; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 32px 140px; }

.topbar { display: flex; align-items: center; justify-content: space-between; height: 60px; border-bottom: 1px solid var(--line); margin-bottom: 48px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand svg { width: 24px; height: 24px; }

.head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 32px; }
.eyebrow { font: 500 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
h1 { font-size: 34px; line-height: 1.1; font-weight: 650; letter-spacing: -.035em; margin: 0; }
.lede { color: var(--ink-2); margin: 10px 0 0; max-width: 560px; font-size: 15px; }
.head-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.head-actions .row-buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.run-status { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.run-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; }
.run-status .dot.idle { background: var(--line-2); }
.run-status .dot.running { background: #2563eb; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s, opacity .12s; }
.btn:hover { background: var(--surface); border-color: #cfcdc8; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn.primary:hover { background: #2a2a28; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { opacity: .9; background: var(--danger); }
.btn.small { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg, .icon-btn svg { width: 15px; height: 15px; flex: none; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; transition: background .12s, color .12s; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 36px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 4px; margin-right: 18px; height: 42px; font-size: 13.5px; font-weight: 550; color: var(--ink-3); text-decoration: none; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); box-shadow: inset 0 -1.5px 0 var(--ink); }
.tabs .count { font: 500 11px/1 var(--mono); color: var(--ink-3); background: var(--surface-2); border-radius: 5px; padding: 3px 5px; }
.tabs .count:empty { display: none; }

.section-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
h2 { font-size: 19px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
.section-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 620px; }

.list { border-top: 1px solid var(--line); }
.item { display: flex; gap: 16px; padding: 20px 4px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.item .glyph { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.item .glyph svg { width: 16px; height: 16px; }
.item .body { flex: 1; min-width: 0; }
.item h3 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.012em; line-height: 1.4; }
.item h3 a { text-decoration: none; }
.item h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.item p { margin: 4px 0 0; color: var(--ink-2); max-width: 700px; overflow-wrap: anywhere; }
.item .tools { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.item:hover .tools, .item:focus-within .tools { opacity: 1; }
@media (hover: none) { .item .tools { opacity: 1; } }
.meta { font: 500 10.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 10px; }
.muted { color: var(--ink-3); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { border: 1px solid transparent; background: transparent; border-radius: 8px; height: 32px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip.on { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.chip .n { font: 500 11px var(--mono); color: var(--ink-3); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; height: 22px; background: var(--surface-2); border-radius: 6px; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); text-decoration: none; }
.tag.script { background: transparent; border: 1px solid var(--line-2); }
.tag.script:hover { border-color: var(--ink-3); color: var(--ink); }

.check { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--primary); cursor: pointer; flex: none; }
.sources { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.sources summary { padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; min-width: 0; }
.sources summary::-webkit-details-marker { display: none; }
.sources summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: 2px; }
.sources[open] summary::before { transform: rotate(45deg); }
.sources summary .pubs { font-weight: 400; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sources ul { margin: 0; padding: 0 14px 10px; list-style: none; }
.sources li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; overflow-wrap: anywhere; }
.sources li a { font-weight: 550; text-decoration: none; }
.sources li a:hover { text-decoration: underline; text-underline-offset: 3px; }
.sources li span { color: var(--ink-3); }

.selection-bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 18px; background: var(--primary); color: var(--primary-ink); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.22); z-index: 10; font-weight: 550; }
.selection-bar .btn { background: #fff; color: var(--ink); border-color: #fff; box-shadow: none; }
.selection-bar .btn.ghost { background: transparent; color: #d4d4d0; border-color: transparent; }
.selection-bar .btn.ghost:hover { color: #fff; background: rgba(255,255,255,.08); }

.empty { border: 1px dashed var(--line-2); border-radius: 14px; padding: 52px 24px; text-align: center; background: var(--surface); }
.empty h3 { margin: 0 0 6px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.empty p { margin: 0 auto 20px; color: var(--ink-2); max-width: 420px; }

/* script editor */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); text-decoration: none; font-size: 13px; font-weight: 550; margin-bottom: 20px; }
.back:hover { color: var(--ink); }
.back svg { width: 15px; height: 15px; }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.title-input { width: 100%; border: 0; background: transparent; font-size: 30px; font-weight: 650; letter-spacing: -.035em; padding: 2px 0; margin-bottom: 16px; border-radius: 6px; }
.title-input:focus { outline: none; }
.subtabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
textarea.doc { display: block; width: 100%; min-height: 480px; resize: vertical; border: 1px solid var(--line-2); border-radius: 12px; padding: 20px 22px; background: var(--bg); font: 15px/1.75 var(--sans); color: var(--ink); }
textarea.doc::placeholder { color: var(--ink-3); }
textarea.doc:focus { outline: none; border-color: #c9c7c2; box-shadow: 0 0 0 4px var(--surface-2); }
.editor-actions { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.save-state { font-size: 12.5px; color: var(--ink-3); margin-left: 6px; }
.save-state.dirty { color: var(--ink-2); }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid #f1d8a8; background: #fff8eb; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
.side { position: sticky; top: 24px; }
.side h4 { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 10px 0 14px; display: flex; justify-content: space-between; align-items: center; }
.side h4 .btn { font-family: var(--sans); letter-spacing: 0; text-transform: none; }
.ref { border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px 14px; margin-bottom: 10px; background: var(--bg); }
.ref-top { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; }
.ref b { font-size: 13.5px; font-weight: 600; line-height: 1.4; }
.ref p { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-2); }
.ref ul { margin: 8px 0 0; padding: 8px 0 0; list-style: none; font-size: 12px; border-top: 1px solid var(--line); }
.ref li { padding: 2px 0; overflow-wrap: anywhere; }
.ref li a { color: var(--ink-2); text-underline-offset: 2px; }
.ref li a:hover { color: var(--ink); }
.ref .icon-btn { width: 26px; height: 26px; flex: none; margin: -3px -4px 0 0; }
.side .hint { font-size: 13px; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 10px; padding: 14px; }
.preview-label { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 28px 0 10px; }
.phone { background: #efe7de; border-radius: 14px; padding: 18px; }
.bubble { background: #fff; color: #111; border-radius: 4px 10px 10px 10px; padding: 10px 12px 8px; max-width: 420px; font: 14.5px/1.45 var(--sans); box-shadow: 0 1px 1px rgba(0,0,0,.1); white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble:empty::before { content: "Nothing to preview yet."; color: var(--ink-3); }
.bubble a { color: #027eb5; }

/* dialogs and toasts */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 64px rgba(0,0,0,.18); }
dialog::backdrop { background: rgba(17,17,16,.36); }
dialog form { padding: 26px; }
dialog h3 { margin: 0 0 6px; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
dialog .sub { margin: 0 0 20px; color: var(--ink-2); font-size: 13.5px; }
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field input, .field textarea, .field select, .time-input { width: 100%; height: 38px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 11px; background: var(--bg); transition: border-color .12s, box-shadow .12s; }
.field textarea { height: auto; min-height: 92px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus, .time-input:focus { outline: none; border-color: #b9b7b1; box-shadow: 0 0 0 4px var(--surface-2); }
.field small { display: block; color: var(--ink-3); margin-top: 6px; font-size: 12.5px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
.dialog-error { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
.prompt-box { font: 13px/1.6 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.times { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.time { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 8px; height: 32px; padding: 0 4px 0 10px; font: 500 13px var(--mono); }
.time .icon-btn { width: 24px; height: 24px; }
.inline { display: flex; gap: 8px; align-items: center; }
.time-input { width: 150px; font-family: var(--mono); }
.choices { display: grid; gap: 8px; margin-bottom: 16px; }
.choice { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.choice:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice input { accent-color: var(--primary); margin: 0; }
.pick-list { max-height: 360px; overflow: auto; border: 1px solid var(--line-2); border-radius: 10px; }
.pick-list label { display: flex; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.pick-list label:hover { background: var(--surface); }
.pick-list label:last-child { border-bottom: 0; }
.pick-list input { accent-color: var(--primary); margin-top: 3px; }
.toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; }
.toast { background: var(--primary); color: var(--primary-ink); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 550; box-shadow: var(--shadow); max-width: 380px; animation: toast-in .18s ease-out; }
.toast.error { background: var(--danger); }
@keyframes toast-in { from { transform: translateY(6px); opacity: 0; } }
.row-actions { display: flex; align-items: center; gap: 6px; }
.meta-link { color: inherit; text-decoration: none; }
.meta-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.warn { color: var(--danger); }
.badge { font: 600 10.5px/1 var(--sans); color: #fff; background: var(--focus); border-radius: 99px; padding: 3px 7px; }
.pill { font: 500 11px/1 var(--mono); background: var(--surface-2); border-radius: 5px; padding: 3px 6px; color: var(--ink-2); }
.suggestions { border: 1px solid #cfe0fb; background: #f5f9ff; border-radius: 14px; padding: 6px 16px; margin-bottom: 28px; }
.label-row { display: flex; align-items: center; gap: 8px; font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: #3d5f99; padding: 12px 0 6px; }
.suggestion { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; padding: 14px 0; border-top: 1px solid #dde8fa; }
.suggestion:first-of-type { border-top: 0; }
.suggestion h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
.suggestion h3 a { text-decoration: none; }
.suggestion h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.suggestion p { margin: 3px 0 0; color: var(--ink-2); }
.suggestion .inline { flex: none; }
.dismissed { margin-top: 20px; color: var(--ink-3); font-size: 13px; }
.dismissed summary { cursor: pointer; }
.dismissed-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
.filter-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); height: 32px; cursor: pointer; }
.toggle input { accent-color: var(--primary); }
.origin { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); border: 1px dashed var(--line-2); }
.origin svg { width: 12px; height: 12px; }
.origin.mine { color: #166534; border: 1px solid #bbe5c8; background: #f0faf3; }
.source-list { list-style: none; margin: 12px 0 0; padding: 0; border-left: 2px solid var(--line); }
.source-list li { display: flex; align-items: baseline; gap: 8px; padding: 3px 0 3px 12px; font-size: 13px; flex-wrap: wrap; }
.source-list a { display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; color: var(--ink); min-width: 0; }
.source-list a span { color: var(--ink-2); overflow-wrap: anywhere; }
.source-list a:hover span { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.source-list a svg { width: 12px; height: 12px; color: var(--ink-3); align-self: center; flex: none; }
.source-list .mine-dot { font-size: 11px; font-weight: 600; color: #166534; background: #f0faf3; border-radius: 5px; padding: 1px 6px; }
.source-list .date { font: 500 11px var(--mono); color: var(--ink-3); }
.finding.is-dismissed { opacity: .55; }
.finding .tools .btn svg { width: 13px; height: 13px; }
.topic-links { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px; }
.tag.removable { padding-right: 2px; gap: 2px; }
.tag.removable .icon-btn { width: 20px; height: 20px; }
.tag.removable .icon-btn svg { width: 12px; height: 12px; }
.small-text { font-size: 13px; }
.toast-action { margin-left: 10px; background: transparent; border: 0; color: #9cc1ff; font-weight: 650; cursor: pointer; padding: 0; }
.loading { color: var(--ink-3); padding: 80px 0; text-align: center; }
code { font: 12.5px var(--mono); background: var(--surface-2); border-radius: 5px; padding: 1px 5px; }

@media (max-width: 820px) {
  .wrap { padding: 0 18px 140px; }
  .topbar { margin-bottom: 32px; }
  .editor { grid-template-columns: 1fr; gap: 28px; }
  .side { position: static; }
  .head { align-items: flex-start; }
  .head-actions { align-items: flex-start; }
  h1 { font-size: 28px; }
  .title-input { font-size: 24px; }
  textarea.doc { min-height: 360px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="#111110"/><path d="M9.5 7.8v8.4a.6.6 0 0 0 .9.5l6.7-4.2a.6.6 0 0 0 0-1l-6.7-4.2a.6.6 0 0 0-.9.5Z" fill="#fff"/></svg>Vid Studio</div>
    <button class="btn ghost small" data-action="settings" id="settings-btn">Settings</button>
  </header>
  <main id="app"><div class="loading">Loading…</div></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>

<script>
"use strict";
// ------------------------------------------------------------------ helpers
const ICONS = {

const icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#";
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
const shortUrl = u => { try { const x = new URL(u); return (x.hostname.replace(/^www\./, "") + x.pathname).replace(/\/$/, ""); } catch { return u; } };
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const today = new Date(); const yesterday = new Date(Date.now() - 864e5);
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === today.toDateString()) return `today ${time}`;
  if (d.toDateString() === yesterday.toDateString()) return `yesterday ${time}`;
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time;
}

async function api(method, path, body) {
  const options = { method, headers: { "X-Vid-Studio": "1" } };
  if (body !== undefined) { options.headers["Content-Type"] = "application/json"; options.body = JSON.stringify(body); }
  const response = await fetch("/api/" + path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) { const error = new Error(data.error || `Request failed (${response.status})`); error.status = response.status; throw error; }
  return data;
}

function toast(message, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = message;
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), kind === "error" ? 6000 : 3200);
}

function undoToast(message, undo) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${esc(message)} <button type="button" class="toast-action">Undo</button>`;
  el.querySelector("button").onclick = () => { el.remove(); undo().catch(e => toast(e.message, "error")); };
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), 6000);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const area = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(area); area.select();
    const ok = document.execCommand("copy"); area.remove(); return ok;
  }
}

// ------------------------------------------------------------------ dialog
const dialog = document.getElementById("dialog");
function openDialog({ title, sub = "", body, submit = "Save", danger = false, cancel = "Cancel", onSubmit, onOpen }) {
  dialog.innerHTML = `<form method="dialog" novalidate>
    <h3>${esc(title)}</h3>${sub ? `<p class="sub">${sub}</p>` : ""}
    ${body}
    <p class="dialog-error" role="alert" hidden></p>
    <div class="dialog-actions">
      ${cancel ? `<button type="button" class="btn" data-close>${esc(cancel)}</button>` : ""}
      ${submit ? `<button type="submit" class="btn ${danger ? "danger" : "primary"}">${esc(submit)}</button>` : ""}
    </div></form>`;
  const form = dialog.querySelector("form");
  dialog.querySelectorAll("[data-close]").forEach(b => b.onclick = () => dialog.close());
  form.onsubmit = async event => {
    event.preventDefault();
    if (!onSubmit) return dialog.close();
    const error = form.querySelector(".dialog-error");
    const button = form.querySelector('button[type="submit"]');
    error.hidden = true; button.disabled = true;
    try { await onSubmit(form); dialog.close(); }
    catch (e) { error.textContent = e.message; error.hidden = false; }
    finally { button.disabled = false; }
  };
  dialog.showModal();
  if (onOpen) onOpen(form);
  const first = form.querySelector("input:not([type=radio]):not([type=checkbox]), textarea");
  if (first) first.focus();
}
const field = (label, input, hint = "") => `<label class="field"><span>${label}</span>${input}${hint ? `<small>${hint}</small>` : ""}</label>`;

function showPrompt(title, text, explain) {
  copyText(text).then(ok => ok && toast("Prompt copied"));
  openDialog({
    title, sub: explain, submit: "Done", cancel: "",
    body: `<div class="prompt-box">${esc(text)}</div>
      <div class="dialog-actions" style="justify-content:flex-start;margin-top:10px"><button type="button" class="btn" id="copy-again">${icon("copy")}Copy again</button></div>`,
    onOpen: form => form.querySelector("#copy-again").onclick = () => copyText(text).then(ok => ok && toast("Prompt copied")),
  });
}

async function refresh(force = false) {
  const next = await api("GET", "state");
  const json = JSON.stringify(next);
  if (!force && json === lastStateJson) return false;
  lastStateJson = json; S = next;
  const known = new Set(S.findings.map(f => f.id));
  selected = new Set([...selected].filter(id => known.has(id)));
  return true;
}

let showDismissed = false;
function findingsPanel() {
  const live = S.findings.filter(f => !f.dismissed_at);
  const dismissedCount = S.findings.length - live.length;
  if (!S.findings.length) {
    return `<div class="section-head"><div><h2>Findings</h2><p>New developments on your topics, from your sources and the wider web.</p></div></div>
      ${empty("No findings yet", S.topics.length ? "Click Research now and paste the prompt into Claude or ChatGPT. New findings appear here on their own."
        : "Add a topic first, then run research.", S.topics.length ? "research" : "new-topic", S.topics.length ? "Research now" : "New topic")}`;
  }
  const inScripts = {};
  S.scripts.forEach(s => s.findings.forEach(f => (inScripts[f] = inScripts[f] || []).push(s)));
  const counts = {};
  live.forEach(f => (f.topics || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  const pool = showDismissed ? S.findings : live;
  const shown = pool.filter(f => topicFilter === "all" || (f.topics || []).includes(topicFilter));
  const sourceName = id => { const s = S.sources.find(x => x.id === id); return s ? shortUrl(s.url) : id; };
  return `<div class="section-head"><div><h2>Findings</h2><p>New developments on your topics, from your sources and the wider web. Select findings to start or extend a script.</p></div></div>
    <div class="filter-row">

        <button class="chip ${topicFilter === "all" ? "on" : ""}" data-action="filter" data-id="all">All topics<span class="n">${live.length}</span></button>

      ${dismissedCount ? `<label class="toggle"><input type="checkbox" data-action="toggle-dismissed" ${showDismissed ? "checked" : ""}>Show dismissed (${dismissedCount})</label>` : ""}
    </div>
    <div class="list">${shown.map(f => {

      return `<article class="item finding ${f.dismissed_at ? "is-dismissed" : ""}">

          <div class="tags">${(f.topics || []).map(t => `<span class="tag">${esc(topicName(t))}</span>`).join("")}
            <span class="origin ${mine.length ? "mine" : ""}">${mine.length ? `${icon("check")}Your source: ${esc(mine.map(sourceName).join(", "))}` : `${icon("globe")}Found on the web`}</span>

          <h3>${esc(f.title)}</h3>

          <ul class="source-list">${f.sources.map(s => `<li>

          <div class="meta">Found ${esc(when(f.found_at))}${f.dismissed_at ? ` · dismissed ${esc(when(f.dismissed_at))}` : ""}</div>

async function renderEditor(id) {
  const app = document.getElementById("app");
  if (!editor || editor.data.id !== id) {
    try { editor = { data: await api("GET", "scripts/" + encodeURIComponent(id)), tab: "script", dirty: false, remoteChanged: false }; }
    catch (e) { app.innerHTML = `<a class="back" href="#/scripts">${icon("back")}Scripts</a><div class="empty"><h3>Script not found</h3><p>${esc(e.message)}</p></div>`; return; }
  }
  const s = editor.data;
  const attached = s.findings.map(findingById).filter(Boolean);
  app.innerHTML = `
    <a class="back" href="#/scripts">${icon("back")}Scripts</a>
    <div class="editor">
      <div>
        ${editor.remoteChanged ? `<div class="banner"><span>Your agent changed this script while you were editing.</span>
          <span class="inline"><button class="btn" data-action="reload-script">Load their version</button><button class="btn ghost" data-action="keep-mine">Keep mine</button></span></div>` : ""}
        <input class="title-input" id="script-title" value="${esc(s.title)}" aria-label="Script title">
        <div class="subtabs" role="tablist">${EDITOR_TABS.map(([key, label]) => `<button class="chip ${editor.tab === key ? "on" : ""}" role="tab" aria-selected="${editor.tab === key}" data-action="editor-tab" data-id="${key}">${label}</button>`).join("")}</div>
        <textarea class="doc" id="script-text" aria-label="${esc(EDITOR_TABS.find(t => t[0] === editor.tab)[1])}" placeholder="${esc(PLACEHOLDERS[editor.tab])}">${esc(s[editor.tab])}</textarea>
        <div class="editor-actions">
          <button class="btn primary" data-action="write-draft">${icon("spark")}Write draft</button>
          <button class="btn" data-action="save-script" id="save-btn" ${editor.dirty ? "" : "disabled"}>Save</button>
          <span class="save-state ${editor.dirty ? "dirty" : ""}" id="save-state">${editor.dirty ? "Unsaved changes" : "All changes saved"}</span>
        </div>
        ${editor.tab === "post" ? `<div class="preview-label">WhatsApp preview</div><div class="phone"><div class="bubble" id="post-preview"></div></div>` : ""}
      </div>
      <aside class="side">
        <h4>Topics <button class="btn ghost small" data-action="link-topic">${icon("plus")}Link</button></h4>
        <div class="topic-links">${s.topics.length ? s.topics.map(t => `<span class="tag removable">${esc(topicName(t))}<button class="icon-btn" data-action="unlink-topic" data-id="${esc(t)}" aria-label="Unlink ${esc(topicName(t))}">${icon("x")}</button></span>`).join("")
          : `<span class="muted small-text">Link a topic to make this an explainer: the draft researches the topic itself.</span>`}</div>
        <h4>Attached findings <button class="btn ghost small" data-action="attach">${icon("plus")}Attach</button></h4>
        ${attached.length ? attached.map(f => `<div class="ref">
            <div class="ref-top"><b>${esc(f.title)}</b><button class="icon-btn" data-action="detach" data-id="${esc(f.id)}" aria-label="Detach ${esc(f.title)}">${icon("x")}</button></div>
            ${f.summary ? `<p>${esc(f.summary)}</p>` : ""}
            <ul>${f.sources.map(src => `<li><a href="${safeUrl(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.publisher || host(src.url))}${src.title ? ": " + esc(src.title) : ""}</a></li>`).join("")}</ul>
          </div>`).join("") : `<div class="hint">${s.topics.length ? "No findings attached. That's fine for an explainer; attach findings to tie it to recent news." : "No findings attached yet. Attach findings, or link a topic for an explainer."}</div>`}
      </aside>
    </div>`;
  const text = document.getElementById("script-text");
  const title = document.getElementById("script-title");
  const preview = () => { const p = document.getElementById("post-preview"); if (p) p.innerHTML = whatsapp(text.value); };
  const markDirty = () => {
    editor.data[editor.tab] = text.value; editor.data.title = title.value; editor.dirty = true;
    document.getElementById("save-btn").disabled = false;
    const state = document.getElementById("save-state");
    state.textContent = "Unsaved changes"; state.classList.add("dirty");
    preview();
  };
  text.addEventListener("input", markDirty);
  title.addEventListener("input", markDirty);
  preview();
}

function whatsapp(text) {
  return esc(text)
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<b>$2</b>")
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?:;]|$)/g, "$1<i>$2</i>")
    .replace(/(^|[\s(])~([^~\n]+)~(?=[\s).,!?:;]|$)/g, "$1<s>$2</s>")
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

async function saveScript() {
  if (!editor || !editor.dirty) return;
  const { id, title, script, post, notes, version } = editor.data;
  try {
    editor.data = await api("PUT", "scripts/" + encodeURIComponent(id), { title, script, post, notes, version });
    editor.dirty = false; editor.remoteChanged = false;
    await refresh(true); renderEditor(id); toast("Saved");
  } catch (e) {
    if (e.status === 409) { editor.remoteChanged = true; renderEditor(id); }
    toast(e.message, "error");
  }
}

async function updateAttachments(changes) {
  const s = editor.data;
  const fresh = await api("PUT", "scripts/" + encodeURIComponent(s.id), changes);
  // Keep unsaved text; links change only script.json, so the new version is safe to adopt.
  editor.data = editor.dirty ? { ...editor.data, findings: fresh.findings, topics: fresh.topics, version: fresh.version } : fresh;
  await refresh(true); renderEditor(s.id);
}

// ------------------------------------------------------------------ actions
const actions = {
  settings() {
    const st = S.settings;
    openDialog({
      title: "Channel settings", sub: `Research and drafting follow these settings. Workspace: <code>${esc(S.workspace)}</code>`,
      body: field("Channel name", `<input name="name" value="${esc(st.name)}" required>`)
        + field("Description", `<input name="description" value="${esc(st.description)}" placeholder="What the channel is about">`)
        + field("Audience", `<input name="audience" value="${esc(st.audience)}" placeholder="Who watches, and what they already know">`)
        + field("Language", `<input name="language" value="${esc(st.language)}">`)
        + field("Script format", `<textarea name="script_format" rows="7">${esc(st.script_format)}</textarea>`, "Length, structure, tone. The agent follows this when drafting.")
        + field("WhatsApp post format", `<textarea name="post_format" rows="3">${esc(st.post_format)}</textarea>`)
        + field("Research notes", `<textarea name="research_notes" rows="3" placeholder="Anything research should always do or avoid">${esc(st.research_notes)}</textarea>`),
      onSubmit: async form => {
        const values = Object.fromEntries(new FormData(form));
        await api("PUT", "settings", values); await refresh(true); render(); toast("Settings saved");
      },
    });
  },
  research() {
    showPrompt("Research now", PROMPTS.research(),
      "Paste this into Claude or ChatGPT, in the project that has this workspace. Your agent researches every topic across the web and your sources, and new findings appear here.");
  },
  schedule() {
    let times = [...(S.settings.schedule?.times || [])];
    const draw = form => {
      form.querySelector("#times").innerHTML = times.length ? times.map(t => `<span class="time">${esc(t)}<button type="button" class="icon-btn" data-remove="${esc(t)}" aria-label="Remove ${esc(t)}">${icon("x")}</button></span>`).join("")
        : `<span class="muted" style="font-size:13px">Manual only. Add a time to research every day.</span>`;
      form.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { times = times.filter(t => t !== b.dataset.remove); draw(form); });
    };
    openDialog({
      title: "Research schedule",
      sub: "Research runs for the whole channel at these times every day. Research now stays available.",
      body: `<div class="field"><span>Daily times</span><div class="times" id="times"></div>
          <div class="inline"><input type="time" id="new-time" class="time-input" aria-label="New time"><button type="button" class="btn" id="add-time">${icon("plus")}Add time</button></div></div>`
        + field("Timezone", `<input name="timezone" value="${esc(S.settings.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone)}">`)
        + `<div class="field"><span>Set it up in Claude or ChatGPT</span><small style="margin:0 0 10px">Create a scheduled task in your project at these times with this prompt:</small>
          <div class="prompt-box">${esc(PROMPTS.scheduled())}</div>
          <button type="button" class="btn" id="copy-schedule" style="margin-top:8px">${icon("copy")}Copy prompt</button></div>`,
      onOpen: form => {
        draw(form);
        form.querySelector("#add-time").onclick = () => {
          const v = form.querySelector("#new-time").value;
          if (v && !times.includes(v)) { times = [...times, v].sort(); draw(form); }
        };
        form.querySelector("#copy-schedule").onclick = () => copyText(PROMPTS.scheduled()).then(ok => ok && toast("Prompt copied"));
      },
      onSubmit: async form => {
        await api("PUT", "settings", { schedule: { times }, timezone: form.timezone.value.trim() });
        await refresh(true); render(); toast("Schedule saved");
      },
    });
  },
  "new-topic"() { topicDialog(); },
  "edit-topic"(id) { topicDialog(S.topics.find(t => t.id === id)); },
  "delete-topic"(id) {
    const t = S.topics.find(x => x.id === id);
    openDialog({ title: `Delete “${t.name}”?`, sub: "Findings stay; they just lose this topic tag.", body: "", submit: "Delete", danger: true,
      onSubmit: async () => { await api("DELETE", "topics/" + encodeURIComponent(id)); if (topicFilter === id) topicFilter = "all"; await refresh(true); render(); } });
  },
  "new-source"() {
    openDialog({
      title: "Add a source", sub: "A website research checks on every run. Paste a homepage or a specific section.",
      body: field("Website URL", `<input name="url" placeholder="https://example.com/news" inputmode="url" required>`)
        + field("Note", `<input name="note" placeholder="Optional, e.g. press releases">`),
      submit: "Add source",
      onSubmit: async form => { await api("POST", "sources", { url: form.url.value, note: form.note.value }); await refresh(true); render(); },
    });
  },
  "edit-source"(id) {
    const s = S.sources.find(x => x.id === id);
    openDialog({ title: shortUrl(s.url), body: field("Note", `<input name="note" value="${esc(s.note)}">`),
      onSubmit: async form => { await api("PUT", "sources/" + encodeURIComponent(id), { note: form.note.value }); await refresh(true); render(); } });
  },
  "delete-source"(id) {
    const s = S.sources.find(x => x.id === id);
    openDialog({ title: `Remove ${shortUrl(s.url)}?`, body: "", submit: "Remove", danger: true,
      onSubmit: async () => { await api("DELETE", "sources/" + encodeURIComponent(id)); await refresh(true); render(); } });
  },
  filter(id) { topicFilter = id; if (route().tab !== "findings") location.hash = "#/findings"; else render(); },
  select(id, el) { el.checked ? selected.add(id) : selected.delete(id); render(); },
  "clear-selection"() { selected.clear(); render(); },
  "add-to-script"() {
    const ids = [...selected];
    const first = findingById(ids[0]);
    openDialog({
      title: "Add to script", sub: `${ids.length} finding${ids.length === 1 ? "" : "s"} will be attached as reference material. Script text is not changed.`,
      body: `${S.scripts.length ? `<div class="choices"><label class="choice"><input type="radio" name="mode" value="new" checked>New script</label>
          <label class="choice"><input type="radio" name="mode" value="existing">Existing script</label></div>` : `<input type="hidden" name="mode" value="new">`}
        <div data-mode="new">${field("Title", `<input name="title" value="${esc(first ? first.title : "")}">`)}</div>
        ${S.scripts.length ? `<div data-mode="existing" hidden>${field("Script", `<select name="script">${S.scripts.map(s => `<option value="${esc(s.id)}">${esc(s.title)}</option>`).join("")}</select>`)}</div>` : ""}`,
      submit: "Add",
      onOpen: form => form.querySelectorAll('input[name="mode"][type="radio"]').forEach(radio => radio.onchange = () =>
        form.querySelectorAll("[data-mode]").forEach(block => block.hidden = block.dataset.mode !== radio.value)),
      onSubmit: async form => {
        const mode = (form.querySelector('input[name="mode"]:checked') || form.querySelector('input[name="mode"]')).value;
        const script = mode === "new" ? await api("POST", "scripts", { title: form.title.value, findings: ids })
          : await api("PUT", "scripts/" + encodeURIComponent(form.script.value), { add_findings: ids });
        selected.clear(); await refresh(true); location.hash = "#/scripts/" + encodeURIComponent(script.id);
      },
    });
  },
  "new-script"() {
    openDialog({ title: "New script", body: field("Title", `<input name="title" placeholder="Untitled script">`), submit: "Create",
      onSubmit: async form => { const s = await api("POST", "scripts", { title: form.title.value }); await refresh(true); location.hash = "#/scripts/" + encodeURIComponent(s.id); } });
  },
  "delete-script"(id) {
    const s = S.scripts.find(x => x.id === id);
    openDialog({ title: `Delete “${s.title}”?`, sub: "The script moves to scripts/.trash in your workspace.", body: "", submit: "Delete", danger: true,
      onSubmit: async () => { await api("DELETE", "scripts/" + encodeURIComponent(id)); await refresh(true); render(); } });
  },
  "editor-tab"(id) { editor.tab = id; renderEditor(editor.data.id); },
  "save-script"() { saveScript(); },
  async "reload-script"() { editor = null; render(); },
  "keep-mine"() { editor.remoteChanged = false; editor.data.version = undefined; renderEditor(editor.data.id); toast("Saving will overwrite your agent's version"); },
  "write-draft"() {
    const s = editor.data;
    if (editor.dirty) saveScript();
    showPrompt("Write draft", PROMPTS.draft(s), s.findings.length
      ? "Paste this into Claude or ChatGPT. Your agent researches the attached findings in depth, then writes the video script, the WhatsApp post, and research notes. They appear here when it's done."
      : "Tip: attach findings first so the draft has material. Paste this into Claude or ChatGPT and your agent will draft from the title alone.");
  },
  attach() {
    const s = editor.data;
    const available = S.findings.filter(f => !s.findings.includes(f.id) && !f.dismissed_at);
    if (!available.length) return toast("No other findings to attach");
    openDialog({
      title: "Attach findings", submit: "Attach",
      body: `<div class="pick-list">${available.map(f => `<label><input type="checkbox" name="f" value="${esc(f.id)}"><span><b>${esc(f.title)}</b><br><span class="muted">${(f.topics || []).map(topicName).map(esc).join(", ")} · found ${esc(when(f.found_at))}</span></span></label>`).join("")}</div>`,
      onSubmit: async form => {
        const ids = [...form.querySelectorAll('input[name="f"]:checked')].map(i => i.value);
        if (ids.length) await updateAttachments({ findings: [...s.findings, ...ids] });
      },
    });
  },
  detach(id) { updateAttachments({ findings: editor.data.findings.filter(f => f !== id) }); },
  "unlink-topic"(id) { updateAttachments({ topics: editor.data.topics.filter(t => t !== id) }); },
  "link-topic"() {
    const s = editor.data;
    const available = S.topics.filter(t => !s.topics.includes(t.id));
    if (!available.length) return toast(S.topics.length ? "All topics are already linked" : "Add a topic first");
    openDialog({
      title: "Link topics", sub: "Write draft researches linked topics directly, which is how explainers work.", submit: "Link",
      body: `<div class="pick-list">${available.map(t => `<label><input type="checkbox" name="t" value="${esc(t.id)}"><span><b>${esc(t.name)}</b><br><span class="muted">${esc(t.description)}</span></span></label>`).join("")}</div>`,
      onSubmit: async form => {
        const ids = [...form.querySelectorAll('input[name="t"]:checked')].map(i => i.value);
        if (ids.length) await updateAttachments({ topics: [...s.topics, ...ids] });
      },
    });
  },
  async "approve-source"(id) { await api("PUT", "sources/" + encodeURIComponent(id), { status: "approved" }); await refresh(true); render(); toast("Source approved. Research will check it every run"); },
  async "dismiss-source"(id) { await api("PUT", "sources/" + encodeURIComponent(id), { status: "dismissed" }); await refresh(true); render(); },
  async "dismiss-finding"(id) {
    await api("PUT", "findings/" + encodeURIComponent(id), { dismissed: true });
    selected.delete(id); await refresh(true); render();
    undoToast("Finding dismissed", async () => { await api("PUT", "findings/" + encodeURIComponent(id), { dismissed: false }); await refresh(true); render(); });
  },
  async "restore-finding"(id) { await api("PUT", "findings/" + encodeURIComponent(id), { dismissed: false }); await refresh(true); render(); },
  "toggle-dismissed"(_, el) { showDismissed = el.checked; render(); },
  "new-explainer"(id) {
    const t = S.topics.find(x => x.id === id);
    openDialog({
      title: "New explainer", sub: `A script linked to “${esc(t.name)}”. Write draft researches the topic from scratch: background, how it works, key numbers.`,
      body: field("Title", `<input name="title" value="${esc(t.name)}" placeholder="e.g. How do chip fabs work?">`), submit: "Create",
      onSubmit: async form => { const s = await api("POST", "scripts", { title: form.title.value, topics: [id] }); await refresh(true); location.hash = "#/scripts/" + encodeURIComponent(s.id); },
    });
  },
};

function topicDialog(topic) {
  openDialog({
    title: topic ? "Edit topic" : "New topic",
    body: field("Name", `<input name="name" value="${esc(topic ? topic.name : "")}" placeholder="e.g. UPI & payments" required>`)
      + field("Description", `<textarea name="description" placeholder="What developments matter, and what should research ignore?">${esc(topic ? topic.description : "")}</textarea>`),
    submit: topic ? "Save" : "Add topic",
    onSubmit: async form => {
      const body = { name: form.name.value, description: form.description.value };
      topic ? await api("PUT", "topics/" + encodeURIComponent(topic.id), body) : await api("POST", "topics", body);
      await refresh(true); render();
    },
  });
}

document.addEventListener("click", event => {
  const el = event.target.closest("[data-action]");
  if (!el || !actions[el.dataset.action]) return;
  if (el.tagName !== "INPUT") event.preventDefault();
  Promise.resolve(actions[el.dataset.action](el.dataset.id, el)).catch(e => toast(e.message, "error"));
});
document.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key === "s" && editor) { event.preventDefault(); saveScript(); }
});
let lastHash = location.hash;
window.addEventListener("hashchange", () => {
  if (editor && editor.dirty && !confirm("You have unsaved changes in this script. Leave anyway?")) { history.replaceState(null, "", lastHash); return; }
  lastHash = location.hash; editor = null; render();
});
window.addEventListener("beforeunload", event => { if (editor && editor.dirty) { event.preventDefault(); event.returnValue = ""; } });

// Pick up changes your agent makes to the files while the page is open.
async function poll() {
  if (document.visibilityState === "visible" && !dialog.open) {
    try {
      if (editor) {
        const remote = await api("GET", "scripts/" + encodeURIComponent(editor.data.id));
        if (editor.data.version && remote.version !== editor.data.version) {
          if (editor.dirty) { if (!editor.remoteChanged) { editor.remoteChanged = true; renderEditor(editor.data.id); } }
          else { editor.data = remote; renderEditor(remote.id); toast("Updated by your agent"); }
        }
        await refresh();
      } else if (await refresh()) {
        const focused = document.activeElement;
        if (!focused || focused === document.body || focused.dataset.action) render();
      }
    } catch { /* server stopped; keep the page as it is */ }
  }
  setTimeout(poll, 4000);
}

document.getElementById("settings-btn").insertAdjacentHTML("afterbegin", icon("gear"));
refresh(true).then(() => { render(); poll(); })
  .catch(e => { document.getElementById("app").innerHTML = `<div class="empty"><h3>Can't reach the studio</h3><p>${esc(e.message)}. Start it with <code>studio.py serve</code>.</p></div>`; });
</script>
