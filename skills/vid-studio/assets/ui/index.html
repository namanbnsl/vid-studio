<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vid Studio</title>
<style>
@font-face { font-family: "Instrument Sans"; src: url(/fonts/instrument-sans.woff2) format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(/fonts/ibm-plex-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(/fonts/ibm-plex-mono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #f8f8f6; --surface-2: #f1f1ee; --line: #ebebe8; --line-2: #dddcd8;
  --ink: #111110; --ink-2: #5a5853; --ink-3: #8f8c86;
  --primary: #111110; --primary-ink: #ffffff; --danger: #c2410c; --focus: #2563eb;
  --radius: 10px;
  --sans: "Instrument Sans", "Aptos", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(17,17,16,.06), 0 8px 24px rgba(17,17,16,.06);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; font-synthesis: none; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: #dbe7fb; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 32px 140px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 72px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.global-tabs { display:flex; gap:6px; align-self:stretch; }
.global-tabs a { display:flex; align-items:center; gap:7px; padding:0 14px; text-decoration:none; color:var(--ink-3); font-size:14px; font-weight:600; }
.global-tabs a.on { color:var(--ink); box-shadow:inset 0 -2px 0 var(--ink); }
.research-context { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px; }
.research-context[hidden], #settings-btn[hidden] { display:none; }
.flow-note { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:0 0 28px; padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:13px; color:var(--ink-2); }
.flow-note a { font-weight:600; text-underline-offset:3px; }
.board-filters { display:flex; gap:8px; flex-wrap:wrap; }
.card-origin { display:flex; flex-wrap:wrap; gap:5px 10px; margin-top:10px; font-size:12px; color:var(--ink-3); }
.card-origin a { text-underline-offset:3px; }
@media(max-width:700px) { .topbar { gap:8px; flex-wrap:wrap; padding-top:14px; } .global-tabs { min-height:48px; width:100%; } .global-tabs a { flex:1; justify-content:center; padding:0 8px; } }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; text-decoration: none; }
.brand svg { width: 24px; height: 24px; }
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.slash { color: var(--line-2); font-size: 20px; font-weight: 300; }
.switcher { position: relative; }
.switch-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 0; border-radius: 8px; background: transparent; font-weight: 600; font-size: 14px; cursor: pointer; max-width: 260px; }
.switch-btn:hover { background: var(--surface-2); }
.switch-btn svg { width: 14px; height: 14px; color: var(--ink-3); flex: none; }
.menu { position: absolute; top: 38px; left: 0; z-index: 20; min-width: 260px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
.menu-label { font-size: 12.5px; color: var(--ink-3); padding: 8px 10px 4px; }
.menu-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-decoration: none; font-size: 13.5px; font-weight: 550; cursor: pointer; text-align: left; }
.menu-item:hover { background: var(--surface); }
.menu-item.on { background: var(--surface-2); }
button.menu-item { justify-content: flex-start; color: var(--ink-2); margin-top: 4px; }
button.menu-item svg { width: 14px; height: 14px; }


.head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 32px; }
h1 { font-size: 34px; line-height: 1.1; font-weight: 650; letter-spacing: -.035em; margin: 0; }
.lede { color: var(--ink-2); margin: 10px 0 0; max-width: 560px; font-size: 15px; }
.head-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.link-btn { border: 0; background: none; padding: 0; font: inherit; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link-btn:hover { color: var(--ink); text-decoration-color: currentColor; }
.run-status { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.run-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; }
.run-status .dot.idle { background: var(--line-2); }
.run-status .dot.running { background: #2563eb; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s, opacity .12s; }
.btn:hover { background: var(--surface); border-color: #cfcdc8; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn.primary:hover { background: #2a2a28; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { opacity: .9; background: var(--danger); }
.btn.small { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg, .icon-btn svg { width: 15px; height: 15px; flex: none; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; transition: background .12s, color .12s; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 36px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 4px; margin-right: 18px; height: 42px; font-size: 13.5px; font-weight: 550; color: var(--ink-3); text-decoration: none; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); box-shadow: inset 0 -1.5px 0 var(--ink); }
.tabs .count { font: 500 11px/1 var(--mono); color: var(--ink-3); background: var(--surface-2); border-radius: 5px; padding: 3px 5px; }
.tabs .count:empty { display: none; }

.section-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
h2 { font-size: 19px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
.section-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 620px; }

.list { display: grid; gap: 8px; }
.item { display: flex; gap: 14px; align-items: flex-start; padding: 16px 16px 16px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); transition: border-color .12s; }
.item[data-card] { cursor: pointer; }
.item[data-card]:hover { border-color: #cfcdc8; }
.item[data-card]:focus-visible { outline-offset: 1px; border-radius: 12px; }
.item.is-selected, .item.is-selected:hover { border-color: var(--ink); }
.item .body { flex: 1; min-width: 0; }
.item h3 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.012em; line-height: 1.4; }
.item h3 a { text-decoration: none; }
.item h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.item p { margin: 4px 0 0; color: var(--ink-2); max-width: 700px; overflow-wrap: anywhere; }
.item .tools { flex: none; display: flex; gap: 6px; align-items: center; margin: -4px -6px 0 0; opacity: 0; transition: opacity .12s; }
.item:hover .tools, .item:focus-within .tools, .item.suggestion .tools, .item.is-dismissed .tools { opacity: 1; }
@media (hover: none) { .item .tools { opacity: 1; } }
.item .tools .icon-btn { width: 28px; height: 28px; }
.item .tools .btn.small { height: 28px; }
.icon-btn.delete:hover { color: var(--danger); background: #fdf1ec; }
.meta { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.muted { color: var(--ink-3); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { border: 1px solid transparent; background: transparent; border-radius: 8px; height: 32px; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface-2); color: var(--ink); }
.chip.on { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.chip .n { font: 500 11px var(--mono); color: var(--ink-3); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tag { display: inline-flex; align-items: center; height: 22px; background: var(--surface-2); border-radius: 6px; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); text-decoration: none; }
.tag.script { background: transparent; border: 1px solid var(--line-2); }
.tag.script:hover { border-color: var(--ink-3); color: var(--ink); }

.check { width: 17px; height: 17px; margin: 3px 0 0; accent-color: var(--primary); cursor: pointer; flex: none; }
.sources { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.sources summary { padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; min-width: 0; }
.sources summary::-webkit-details-marker { display: none; }
.sources summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: 2px; }
.sources[open] summary::before { transform: rotate(45deg); }
.sources summary .pubs { font-weight: 400; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sources ul { margin: 0; padding: 0 14px 10px; list-style: none; }
.sources li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; overflow-wrap: anywhere; }
.sources li a { font-weight: 550; text-decoration: none; }
.sources li a:hover { text-decoration: underline; text-underline-offset: 3px; }
.sources li span { color: var(--ink-3); }

.selection-bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(520px, calc(100vw - 32px)); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 18px; background: var(--primary); color: var(--primary-ink); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.22); z-index: 10; font-weight: 550; }
.selection-bar .btn { background: #fff; color: var(--ink); border-color: #fff; box-shadow: none; }
.selection-bar .btn.ghost { background: transparent; color: #d4d4d0; border-color: transparent; }
.selection-bar .btn.ghost:hover { color: #fff; background: rgba(255,255,255,.08); }

.empty { border: 1px dashed var(--line-2); border-radius: 14px; padding: 52px 24px; text-align: center; background: var(--surface); }
.empty h3 { margin: 0 0 6px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.empty p { margin: 0 auto 20px; color: var(--ink-2); max-width: 420px; }

/* script editor */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); text-decoration: none; font-size: 13px; font-weight: 550; margin-bottom: 20px; }
.back:hover { color: var(--ink); }
.back svg { width: 15px; height: 15px; }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.title-input { width: 100%; border: 0; background: transparent; font-size: 30px; font-weight: 650; letter-spacing: -.035em; padding: 2px 0; margin-bottom: 16px; border-radius: 6px; }
.title-input:focus { outline: none; }
.subtabs { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.subtabs > div { display: flex; gap: 4px; flex-wrap: wrap; }
textarea.doc, .md { display: block; width: 100%; height: 480px; overflow: auto; scrollbar-gutter: stable; border: 1px solid var(--line-2); border-radius: 12px; padding: 20px 22px; background: var(--bg); font: 15px/1.75 var(--sans); color: var(--ink); overflow-wrap: anywhere; }
textarea.doc { resize: none; }
textarea.doc::placeholder { color: var(--ink-3); }
textarea.doc.short { height: 260px; }
.md { cursor: text; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { letter-spacing: -.02em; line-height: 1.3; margin: 1.6em 0 .5em; font-weight: 650; }
.md h1 { font-size: 24px; } .md h2 { font-size: 19px; } .md h3 { font-size: 16.5px; } .md h4, .md h5, .md h6 { font-size: 15px; }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 1em; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--ink-3); }
.md blockquote { border-left: 3px solid var(--line-2); padding: 2px 0 2px 16px; color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
.md a { color: var(--focus); text-underline-offset: 2px; }
.md pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 13px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--surface); font-weight: 600; }
.md .cite { font-size: 11px; color: var(--ink-3); vertical-align: super; }
.md-empty { color: var(--ink-3); }
.md em { font-synthesis: style; }
textarea.doc:focus { outline: none; border-color: #c9c7c2; box-shadow: 0 0 0 4px var(--surface-2); }
.doc-tools { display: flex; align-items: center; gap: 8px; }
.doc-tools .btn.small { height: 32px; }
.doc-tools .btn.ghost:last-child { margin-right: -10px; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid #f1d8a8; background: #fff8eb; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
.side { position: sticky; top: 24px; }
.side-actions { display: grid; gap: 8px; margin: 6px 0 28px; }
.side-actions .btn { height: 40px; }
.side section + section { margin-top: 22px; }
.side h4 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.side h4 .btn { margin-right: -10px; }
.ref { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.ref-top { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; }
.ref b { font-size: 13.5px; font-weight: 600; line-height: 1.4; }
.ref p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.ref ul { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; }
.ref li { padding: 1px 0; overflow-wrap: anywhere; }
.ref li a { color: var(--ink-3); text-decoration: none; }
.ref li a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.ref .icon-btn { width: 24px; height: 24px; flex: none; margin: -3px -6px 0 0; opacity: 0; }
.ref:hover .icon-btn, .ref:focus-within .icon-btn { opacity: 1; }
@media (hover: none) { .ref .icon-btn { opacity: 1; } }
.ref .icon-btn svg { width: 14px; height: 14px; }
.preview-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 24px 0 8px; }
.phone { background: #efe7de; border-radius: 14px; padding: 18px; }
.bubble { background: #fff; color: #111; border-radius: 4px 10px 10px 10px; padding: 10px 12px 8px; max-width: 420px; font: 14.5px/1.45 var(--sans); box-shadow: 0 1px 1px rgba(0,0,0,.1); white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble:empty::before { content: "Nothing to preview yet."; color: var(--ink-3); }
.bubble a { color: #027eb5; }

/* dialogs and toasts */
dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 24px 64px rgba(0,0,0,.18); }
dialog::backdrop { background: rgba(17,17,16,.36); }
dialog form { padding: 26px; }
dialog h3 { margin: 0 0 6px; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
dialog .sub { margin: 0 0 20px; color: var(--ink-2); font-size: 13.5px; }
.field { display: block; margin-bottom: 16px; }
.field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field input, .field textarea, .field select, .time-input { width: 100%; height: 38px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 11px; background: var(--bg); transition: border-color .12s, box-shadow .12s; }
.field textarea { height: auto; min-height: 92px; padding: 9px 11px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus, .time-input:focus { outline: none; border-color: #b9b7b1; box-shadow: 0 0 0 4px var(--surface-2); }
.field small { display: block; color: var(--ink-3); margin-top: 6px; font-size: 12.5px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
.dialog-error { color: var(--danger); font-size: 13px; margin: 10px 0 0; }
.prompt-box { font: 13px/1.6 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.times { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 32px; margin-bottom: 10px; }
.muted.small { font-size: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(17,17,16,.1); }
.days { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.day { width: 46px; height: 32px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.day:hover { border-color: var(--ink-3); }
.day.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.time { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 8px; height: 32px; padding: 0 4px 0 10px; font: 500 13px var(--mono); }
.time .icon-btn { width: 24px; height: 24px; }
.inline { display: flex; gap: 8px; align-items: center; }
.time-input { width: 150px; font-family: var(--mono); }
.choices { display: grid; gap: 8px; margin-bottom: 16px; }
.choice { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.choice:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice input { accent-color: var(--primary); margin: 0; }
.pick-list { max-height: 360px; overflow: auto; border: 1px solid var(--line-2); border-radius: 10px; }
.pick-list label { display: flex; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.pick-list label:hover { background: var(--surface); }
.pick-list label:last-child { border-bottom: 0; }
.pick-list input { accent-color: var(--primary); margin-top: 3px; }
.toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; }
.toast { background: var(--primary); color: var(--primary-ink); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 550; box-shadow: var(--shadow); max-width: 380px; animation: toast-in .18s ease-out; }
.toast.error { background: var(--danger); }
@keyframes toast-in { from { transform: translateY(6px); opacity: 0; } }
.meta-link { color: inherit; text-decoration: none; }
.meta-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.warn { color: var(--danger); }
.badge { font: 600 10.5px/1 var(--sans); color: #fff; background: var(--focus); border-radius: 99px; padding: 3px 7px; }

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const today = new Date(); const yesterday = new Date(Date.now() - 864e5);
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === today.toDateString()) return `today ${time}`;
  if (d.toDateString() === yesterday.toDateString()) return `yesterday ${time}`;
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + time;
}

async function api(method, path, body) {
  const options = { method, headers: { "X-Vid-Studio": "1" } };
  // Every write is JSON, deletes included: the server refuses writes without this content type.
  if (method !== "GET") { options.headers["Content-Type"] = "application/json"; options.body = JSON.stringify(body ?? {}); }
  const response = await fetch("/api/" + path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) { const error = new Error(data.error || `Request failed (${response.status})`); error.status = response.status; throw error; }
  return data;
}

function toast(message, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = message;
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), kind === "error" ? 6000 : 3200);
}

function undoToast(message, undo) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${esc(message)} <button type="button" class="toast-action">Undo</button>`;
  el.querySelector("button").onclick = () => { el.remove(); undo().catch(e => toast(e.message, "error")); };
  document.getElementById("toasts").append(el);
  setTimeout(() => el.remove(), 6000);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const area = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(area); area.select();
    const ok = document.execCommand("copy"); area.remove(); return ok;
  }
}

const DAY_NAMES = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat", sun: "Sun" };
// Matches describe_schedule in studio.py, e.g. "weekdays at 07:00 and 19:00".
function describeSchedule(schedule = {}) {
  const times = schedule.times || [], days = schedule.days?.length ? schedule.days : DAYS;
  if (!times.length) return "";
  const when = days.length === 7 ? "every day" : days.join() === DAYS.slice(0, 5).join() ? "weekdays"
    : days.join() === DAYS.slice(5).join() ? "weekends" : days.map(d => DAY_NAMES[d]).join(", ");
  return `${when} at ${times.join(" and ")}`;
}

// ------------------------------------------------------------------ scenes: parser and preview player
// Mirrors parse_scenes in studio.py (see references/scenes.md), so previews update while you type.
const SCENE_TYPES = ["title", "stat", "bars", "compare", "list", "quote", "timeline", "text", "image", "end"];
const spokenText = t => String(t).replace(/!?\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/\[(\d+(?:\s*[,–—-]\s*\d+)*)\](?!\()/g, "")
  .replace(/\*\*|__|[*_`]/g, "").replace(/\s+/g, " ").trim();
const wordCount = t => t.split(/\s+/).filter(w => /[\p{L}\p{N}]/u.test(w)).length;
const fmtTime = sec => { const s = Math.round(sec || 0); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : `${s}s`; };

function parseScenes(src, wpm = 160) {
  const beats = [];
  let beat = null;
  for (const raw of String(src || "").replace(/\r\n?/g, "\n").split("\n")) {
    const line = raw.trim();
    const heading = line.match(/^##\s+(.*)$/);
    if (heading) { beat = { beat: heading[1].replace(/[#*_]/g, "").trim(), vo: [], visual: null, text: "", note: "" }; beats.push(beat); continue; }
    if (!beat || !line || /^#/.test(line)) continue;
    const label = line.replace(/^[-*]\s+/, "").match(/^[*_]{0,2}(visual|text|note)[*_]{0,2}\s*:[*_]{0,2}\s*(.*)$/i);
    if (label) beat[label[1].toLowerCase()] = label[2].trim();
    else beat.vo.push(line);
  }
  return beats.map(b => {
    const vo = spokenText(b.vo.join(" "));
    const [type, data] = sceneData(b.visual, vo);
    const scene = { beat: b.beat, type, duration: Math.max(1.5, Math.floor(wordCount(vo) * 600 / wpm + 0.5) / 10), vo, text: b.text, data };
    if (b.note) scene.note = b.note;
    return scene;
  });
}

function sceneData(visual, vo) {
  if (!visual) return ["text", { text: vo }];
  const parts = visual.split("|").map(x => x.trim()), f = parts.slice(1), type = parts[0].toLowerCase();
  const pair = (x, first) => { const i = first ? x.indexOf(":") : x.lastIndexOf(":"); return i > 0 && x.slice(i + 1).trim() ? [x.slice(0, i).trim(), x.slice(i + 1).trim()] : [x, ""]; };
  const v = i => f[i] || "";
  switch (SCENE_TYPES.includes(type) ? type : "") {
    case "title": return [type, { title: v(0), subtitle: v(1), kicker: v(2) }];
    case "stat": return [type, { value: v(0), label: v(1), context: v(2) }];
    case "bars": case "compare": return [type, { title: v(0), items: f.slice(1).map(x => { const [label, value] = pair(x, false); return { label, value }; }) }];
    case "list": return [type, { title: v(0), items: f.slice(1) }];
    case "quote": return [type, { quote: v(0), source: v(1) }];
    case "timeline": return [type, { title: v(0), items: f.slice(1).map(x => { const [date, label] = pair(x, true); return { date, label }; }) }];
    case "text": return [type, { text: v(0) || vo }];
    case "image": return [type, { description: v(0), url: v(1) }];
    case "end": return [type, { title: v(0), cta: v(1) }];
    default: return ["image", { description: visual, url: "" }];
  }
}

// One preview at a time: an iframe running /scenes/player.html, fed over postMessage.
const PLAYER = { frame: null, ready: false, pending: null, duration: 0, time: 0, playing: false, scene: -1, scenes: [], scrubbing: false };
function mountPlayer(host, payload) {
  host.innerHTML = `<iframe class="player-frame" src="/scenes/player.html" title="Video preview"></iframe>`;
  Object.assign(PLAYER, { frame: host.querySelector("iframe"), ready: false, pending: payload, duration: 0, time: 0, playing: false, scene: -1, scenes: [] });
}
const playerSend = message => PLAYER.frame?.contentWindow?.postMessage(message, location.origin);
function playerLoad(payload) {
  if (!PLAYER.frame) return;
  if (PLAYER.ready) playerSend({ type: "load", ...payload }); else PLAYER.pending = payload;
}
// Rebuild after an edit without losing your place.
function playerReload(design, scenes, extra = {}) {
  playerLoad({ design, scenes, options: { autoplay: PLAYER.playing, loop: true, captions: true, startAt: PLAYER.time, ...extra } });
}
window.addEventListener("message", event => {
  if (!PLAYER.frame || event.source !== PLAYER.frame.contentWindow) return;
  const m = event.data || {};
  if (m.type === "ready") { PLAYER.ready = true; if (PLAYER.pending) { playerSend({ type: "load", ...PLAYER.pending }); PLAYER.pending = null; } }
  else if (m.type === "loaded") { PLAYER.duration = m.duration || 0; PLAYER.scenes = m.scenes || []; document.querySelector(".player-error")?.remove(); updatePlayerBar(); }
  else if (m.type === "time") { Object.assign(PLAYER, { time: m.time, playing: m.playing, scene: m.scene }); updatePlayerBar(); }
  else if (m.type === "error") {
    const host = PLAYER.frame.parentElement;
    if (!host.querySelector(".player-error")) host.insertAdjacentHTML("beforeend", `<div class="player-error"></div>`);
    host.querySelector(".player-error").textContent = m.message;
  }
});
const playerBar = () => `<div class="player-bar"><button type="button" class="icon-btn play-btn" data-action="player-toggle" aria-label="Play">${icon("play")}</button>
    <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0" aria-label="Seek"><span class="ptime" id="ptime">0s</span></div>`;
function updatePlayerBar() {
  const btn = document.querySelector(".play-btn");
  if (btn) { btn.innerHTML = icon(PLAYER.playing ? "pause" : "play"); btn.setAttribute("aria-label", PLAYER.playing ? "Pause" : "Play"); }
  const scrub = document.getElementById("scrub");
  if (scrub && !PLAYER.scrubbing) scrub.value = PLAYER.duration ? Math.round(PLAYER.time / PLAYER.duration * 1000) : 0;
  const time = document.getElementById("ptime");
  if (time) time.textContent = `${fmtTime(PLAYER.time)} / ${fmtTime(PLAYER.duration)}`;
  document.querySelectorAll("[data-beat-index]").forEach(el => el.classList.toggle("on", Number(el.dataset.beatIndex) === PLAYER.scene));
}
document.addEventListener("input", event => {
  if (event.target.id !== "scrub") return;
  PLAYER.scrubbing = true;
  playerSend({ type: "seek", time: event.target.value / 1000 * PLAYER.duration });
});
document.addEventListener("change", event => { if (event.target.id === "scrub") PLAYER.scrubbing = false; });

// ------------------------------------------------------------------ channel: look and voice
let CV = null;              // open channel: { id, design, voice, setup, sample, savedDesign, savedVoice, safeArea }
let CATALOG = null;         // { presets, fonts, sample }
let setupChannel = null;    // the channel being set up right after creating it
const timers = {};
const debounce = (key, ms, fn) => { clearTimeout(timers[key]); timers[key] = setTimeout(() => { delete timers[key]; fn(); }, ms); };
const channelViews = new Map(), saveQueues = new Map();
let channelRenderToken = 0, editorRenderToken = 0;
const channelRoute = id => route().scope === "channels" && route().id === id;
const channelKey = (view, resource) => `channel:${view.id}:${resource}`;
const channelDirty = view => JSON.stringify(view.design) !== view.savedDesign || JSON.stringify(view.voice) !== view.savedVoice || JSON.stringify(view.fields) !== view.savedFields;
// Queue immutable snapshots: edits on another channel cannot cancel or redirect a pending write.
function queueChannelSave(view, resource, snapshot) {
  const key = channelKey(view, resource), body = structuredClone(snapshot);
  const next = (saveQueues.get(key) || Promise.resolve()).catch(() => {}).then(async () => {
    const saved = await api("PUT", `channels/${enc(view.id)}${resource === "fields" ? "" : "/" + resource}`, body);
    const marker = resource === "design" ? "savedDesign" : resource === "voice" ? "savedVoice" : "savedFields";
    view[marker] = JSON.stringify(resource === "fields" ? body : saved);
    if (JSON.stringify(view[resource]) === JSON.stringify(body) && resource !== "fields") view[resource] = saved;
    if (CV === view && channelRoute(view.id)) { const note = document.getElementById("save-note"); if (note) note.textContent = channelDirty(view) ? "Saving…" : "Saved"; }
    return saved;
  }).catch(e => { if (CV === view) { const note = document.getElementById("save-note"); if (note) note.textContent = "Couldn't save"; } toast(e.message, "error"); throw e; });
  saveQueues.set(key, next);
  next.finally(() => { if (saveQueues.get(key) === next) saveQueues.delete(key); }).catch(() => {});
  return next;
}
function scheduleChannelSave(view, resource) {
  const snapshot = structuredClone(view[resource]);
  debounce(channelKey(view, resource), 700, () => queueChannelSave(view, resource, snapshot).catch(() => {}));
}
function focusSnapshot() {
  const el = document.activeElement;
  if (!el || !document.getElementById("app").contains(el)) return null;
  const key = ["design", "voice", "voiceLines", "channelField"].find(k => el.dataset[k]);
  const selector = el.id ? `#${CSS.escape(el.id)}` : key ? `[data-${key.replace(/[A-Z]/g, x => "-" + x.toLowerCase())}="${CSS.escape(el.dataset[key])}"]` : null;
  return selector ? { selector, start: el.selectionStart, end: el.selectionEnd, scroll: el.scrollTop, value: el.value } : null;
}
function restoreFocus(saved) {
  const el = saved && document.querySelector(saved.selector);
  if (!el) return;
  if (el.id === "published-url") el.value = saved.value;
  el.focus({ preventScroll: true });
  if (saved.start !== null && saved.start !== undefined && typeof el.setSelectionRange === "function") { try { el.setSelectionRange(saved.start, saved.end); } catch {} }
  el.scrollTop = saved.scroll;
}
const getPath = (obj, path) => path.split(".").reduce((o, k) => o?.[k], obj);
function setPath(obj, path, value) { const keys = path.split("."); let o = obj; keys.slice(0, -1).forEach(k => o = o[k] ??= {}); o[keys.at(-1)] = value; }

async function loadCatalog() {
  if (CATALOG) return;
  const [presets, fonts, sample] = await Promise.all([api("GET", "presets"), api("GET", "fonts"),
    fetch("/scenes/sample.json").then(r => r.ok ? r.json() : {}).catch(() => ({}))]);
  CATALOG = { presets: Array.isArray(presets) ? presets : presets.presets || [], fonts: fonts.fonts || [], sample };
}
const sampleScenes = () => CATALOG.sample[CV.sample] || CATALOG.sample.en || [];
const lookPayload = () => ({ design: CV.design, scenes: sampleScenes(), options: { autoplay: true, loop: true, captions: true, safeArea: CV.safeArea } });

async function renderChannel(id, tab) {
  const token = ++channelRenderToken, hash = location.hash, focus = focusSnapshot();
  const current = () => token === channelRenderToken && location.hash === hash && channelRoute(id);
  const app = document.getElementById("app");
  const c = channelById(id);

    await loadCatalog();
    if (!current()) return;
    if (!CV || CV.id !== id) {
      CV = channelViews.get(id) || null;
    }
    if (!CV) {
      const [design, voice] = await Promise.all([api("GET", `channels/${enc(id)}/design`), api("GET", `channels/${enc(id)}/voice`)]);
      if (!current()) return;
      CV = { id, design, voice, fields: { format: c.format || "" }, savedFields: JSON.stringify({ format: c.format || "" }), ask: {}, setup: setupChannel === id, sample: c.language === "English" ? "en" : "hi",

  const tabs = c.kind === "video" ? [["look", "Look"], ["voice", "Voice"]] : [["voice", "Voice"]];

    <section class="head"><div><h1>${esc(c.name)}</h1><p class="lede">${esc([c.platform, c.kind === "post" ? "Text post" : "Video script", c.language].filter(Boolean).join(" · "))}</p></div>

      : `<nav class="tabs" aria-label="Channel">${tabs.map(([key, label]) => `<a href="${channelHref(c.id, key)}" class="${tab === key ? "on" : ""}">${icon(key === "look" ? "palette" : "mic")}${label}</a>`).join("")}</nav>`}

      ? `<a class="btn primary" href="${channelHref(c.id, "voice")}">Next: Voice</a>` : `<button class="btn primary" data-action="finish-setup">Finish setup</button>`}</div>` : ""}`;

// Voice ---------------------------------------------------------------
const TONES = [["playful", "Serious", "Playful"], ["casual", "Formal", "Casual"], ["intensity", "Calm", "Intense"]];
const HOOK_STYLES = [["question", "Question"], ["surprising-stat", "Surprising number"], ["myth-bust", "Myth-bust"], ["story", "Story"], ["stakes", "Stakes"], ["contrast", "Contrast"]];
function voicePanel(c) {
  const v = CV.voice, words = Math.round((v.length_seconds || 60) / 60 * (v.words_per_minute || 160));
  const lines = key => esc((v[key] || []).join("\n"));
  const vRange = (key, min, max, step, show) => `<div class="slider"><input type="range" min="${min}" max="${max}" step="${step}" value="${esc(getPath(v, key))}" data-voice="${key}" data-number><output data-voice-show="${key}">${esc(show(getPath(v, key)))}</output></div>`;
  return `<div class="studio-split">
    <div class="controls">
      <section class="ctl"><h4>Length &amp; pace</h4>
        ${c.kind === "video" ? `<div class="row"><span>Target length</span>${vRange("length_seconds", 15, 180, 5, x => fmtTime(x))}</div>
        <div class="row"><span>Speaking pace</span>${vRange("words_per_minute", 100, 220, 5, x => `${x} wpm`)}</div>
        <p class="muted small" id="word-budget">About ${words} spoken words. Hindi and Hinglish voiceovers usually run 140–170 words a minute.</p>`
        : `<p class="muted small">Posts have no timing. The format below sets their length.</p>`}</section>
      <section class="ctl"><h4>Persona</h4>
        <textarea class="text-area" data-voice="persona" rows="3" placeholder="Who is talking? e.g. A sharp older sibling who works in finance and hates jargon.">${esc(v.persona || "")}</textarea></section>
      <section class="ctl"><h4>Tone</h4>${TONES.map(([key, low, high]) => `<div class="tone"><span>${low}</span>
        <input type="range" min="0" max="100" step="5" value="${esc(v.tone?.[key] ?? 50)}" data-voice="tone.${key}" data-number aria-label="${low} to ${high}"><span>${high}</span></div>`).join("")}</section>
      <section class="ctl"><h4>Hooks your agent may use</h4>
        <div class="toggle-chips">${HOOK_STYLES.map(([key, label]) => `<button type="button" class="chip ${(v.hook_styles || []).includes(key) ? "on" : ""}" data-action="toggle-hook" data-id="${key}">${label}</button>`).join("")}</div>
        <p class="muted small">Each draft comes with 3–5 hooks in these styles; you pick the winner.</p></section>
      <section class="ctl"><h4>Structure</h4>
        <textarea class="text-area mono" data-channel-field="format" rows="8">${esc(CV.fields.format)}</textarea>
        <p class="muted small">The beats every script follows, with rough seconds. Your agent fits each story to it.</p></section>
      <section class="ctl two"><div><h4>Always</h4><textarea class="text-area" data-voice-lines="do" rows="5" placeholder="One rule per line">${lines("do")}</textarea></div>
        <div><h4>Never</h4><textarea class="text-area" data-voice-lines="dont" rows="5" placeholder="One rule per line">${lines("dont")}</textarea></div></section>
      <section class="ctl"><h4>Signature lines</h4>
        <div class="row"><span>Opening</span><input class="text-input" data-voice="open" value="${esc(v.open || "")}" placeholder="Optional, said after the hook"></div>
        <div class="row"><span>Sign-off</span><input class="text-input" data-voice="close" value="${esc(v.close || "")}" placeholder="Optional"></div>
        <div class="row"><span>Call to action</span><input class="text-input" data-voice="cta" value="${esc(v.cta || "")}" placeholder="e.g. Follow for one money rule a day"></div></section>
      <section class="ctl"><h4>Scripts you love <button type="button" class="btn ghost small" data-action="add-example">${icon("plus")}Add</button></h4>
        ${(v.examples || []).map((x, i) => `<div class="example"><div class="ref-top"><b>${esc(x.title || "Example")}</b><button type="button" class="icon-btn" data-action="remove-example" data-id="${i}" aria-label="Remove">${icon("x")}</button></div>
          ${x.why ? `<p class="muted small">${esc(x.why)}</p>` : ""}<pre>${esc(x.text.slice(0, 400))}${x.text.length > 400 ? "…" : ""}</pre></div>`).join("")
          || `<p class="muted small">Paste scripts from creators (or your own) whose voice you want. Your agent studies their rhythm and wording, never their facts.</p>`}</section>
    </div>
    <div class="preview-col">
      <div class="voice-card" id="voice-card">${voiceSummary(c)}</div>
      <p class="save-note" id="save-note"></p>

    </div></div>`;
}

function voiceSummary(c) {
  const v = CV.voice, t = v.tone || {};
  const word = (x, low, mid, high) => x < 35 ? low : x > 65 ? high : mid;
  const words = Math.round((v.length_seconds || 60) / 60 * (v.words_per_minute || 160));
  return `<h4>What your agent will write</h4>
    <p class="voice-line">${esc(v.persona || "A clear, confident explainer.")}</p>
    <dl class="facts"><dt>Tone</dt><dd>${[word(t.playful ?? 50, "Serious", "A little playful", "Playful"), word(t.casual ?? 50, "formal", "conversational", "very casual"),

      <dt>Language</dt><dd>${esc(c.language)}</dd>
      <dt>Hooks</dt><dd>${esc((v.hook_styles || []).map(h => (HOOK_STYLES.find(x => x[0] === h) || [h, h])[1]).join(", ") || "Any")}</dd>

      <dt>Learns from</dt><dd>${(v.examples || []).length ? plural(v.examples.length, "example script") : "No examples yet"}</dd></dl>`;

document.addEventListener("input", event => {
  if (!CV) return;
  const el = event.target;
  if (el.dataset.design) {
    setPath(CV.design, el.dataset.design, el.dataset.number !== undefined ? Number(el.value) : el.value);
    if (el.type === "color") { const code = document.querySelector(`[data-show="${CSS.escape(el.dataset.design)}"]`); if (code) code.textContent = el.value; }
    designChanged(el.dataset.design);
  } else if (el.dataset.voice) {
    setPath(CV.voice, el.dataset.voice, el.dataset.number !== undefined ? Number(el.value) : el.value);
    const show = document.querySelector(`[data-voice-show="${CSS.escape(el.dataset.voice)}"]`);
    if (show) show.textContent = el.dataset.voice === "length_seconds" ? fmtTime(el.value) : `${el.value} wpm`;
    voiceChanged();
  } else if (el.dataset.voiceLines) {
    CV.voice[el.dataset.voiceLines] = el.value.split("\n").map(x => x.trim()).filter(Boolean);

    CV.fields[el.dataset.channelField] = el.value;
    scheduleChannelSave(CV, "fields");
    const note = document.getElementById("save-note"); if (note) note.textContent = "Saving…";

    CV.ask[CV.tab] = el.value;

document.addEventListener("change", event => {

// ------------------------------------------------------------------ story and script editor
const EDITORS = {
  story: { path: id => "stories/" + enc(id), key: "notes", back: "stories", backLabel: "Stories", label: "Research notes",
    placeholder: "Research notes and numbered sources. Click Research story to have your agent research the findings and topics in depth and write them here." },
  script: { path: id => "scripts/" + enc(id), key: "text", back: "scripts", backLabel: "Scripts", label: "Script",
    placeholder: "The script. Click Write draft to have your agent write it from the story's research, in this channel's language and format." },
};
const docKey = () => EDITORS[editor.kind].key;
const docText = () => editor.data[docKey()];
const isPost = () => editor.kind === "script" && (channelById(editor.data.channel) || {}).kind === "post";
const canPreview = () => !isPost() && docText().trim();
const rerender = () => renderEditor(editor.kind, editor.data.id);

async function renderEditor(kind, id) {
  const owner = PROJECT;
  if (kind === "script" && (!owner || route().scope !== "production" || route().project !== owner)) return renderUnavailableProject();
  const token = ++editorRenderToken, hash = location.hash, focus = focusSnapshot();
  const current = () => token === editorRenderToken && hash === location.hash && route().id === id && route().tab === EDITORS[kind].back && route().project === owner && PROJECT === owner;
  const app = document.getElementById("app");
  const E = EDITORS[kind];
  if (!editor || editor.kind !== kind || editor.data.id !== id || editor.project !== owner) {
    try {
      const data = await papi("GET", E.path(id));
      if (!current()) return;
      editor = { kind, project: owner, data, dirty: false, remoteChanged: false };
      editor.view = canPreview() ? "preview" : "edit";
      if (kind === "script" && !isPost()) {
        const channel = enc(editor.data.channel);
        const view = editor;
        const [design, voice] = await Promise.all([api("GET", `channels/${channel}/design`), api("GET", `channels/${channel}/voice`)]).catch(() => [null, null]);
        if (!current() || editor !== view) return;
        Object.assign(view, { design, voice });
        editor.sideTab = docText().trim() ? "preview" : "hooks";
      }
    }
    catch (e) { if (!current()) return; app.innerHTML = `<a class="back" href="${kind === "script" ? "#/production" : base() + "/stories"}">${icon("back")}${E.backLabel}</a><div class="empty"><h3>Not found</h3><p>${esc(e.message)}</p></div>`; return; }
  }
  const d = editor.data, preview = canPreview() && editor.view === "preview";
  app.innerHTML = `
    <a class="back" href="${kind === "script" ? "#/production" : base() + "/stories"}">${icon("back")}${E.backLabel}</a>
    <div class="editor">
      <div>
        ${editor.remoteChanged ? `<div class="banner"><span>Your agent changed this ${kind} while you were editing.</span>
          <span class="inline"><button class="btn" data-action="reload-doc">Load their version</button><button class="btn ghost" data-action="keep-mine">Keep mine</button></span></div>` : ""}
        <input class="title-input" id="doc-title" value="${esc(d.title)}" aria-label="Title">
        ${kind === "script" ? scriptHeader() : ""}
        <div class="subtabs"><div class="doc-label">${isPost() ? "Post" : E.label}${kind === "script" && !isPost() ? ` <span class="timing" id="timing">${timingLabel()}</span>` : ""}</div>
          <div class="doc-tools" id="doc-tools">${docTools()}</div></div>
        ${preview ? `<div class="md ${kind === "script" && !isPost() ? "beats-md" : ""}" id="md-preview" title="Double-click to edit">${kind === "script" && !isPost() ? scriptMarkdown(docText()) : markdown(docText())}</div>` : ""}
        <textarea class="doc ${isPost() ? "short" : ""}" id="doc-text" ${preview ? "hidden" : ""} aria-label="${esc(E.label)}" placeholder="${esc(E.placeholder)}">${esc(docText())}</textarea>
        ${isPost() ? `<div class="preview-label">WhatsApp preview</div><div class="phone"><div class="bubble" id="post-preview"></div></div>` : ""}
      </div>
      <aside class="side">${kind === "story" ? storySide() : scriptSide()}</aside>
    </div>`;
  const text = document.getElementById("doc-text");
  const title = document.getElementById("doc-title");
  const postPreview = () => { const p = document.getElementById("post-preview"); if (p) p.innerHTML = whatsapp(text.value); };
  const markDirty = () => {
    const wasDirty = editor.dirty;
    editor.data[docKey()] = text.value; editor.data.title = title.value; editor.dirty = true;
    if (!wasDirty) document.getElementById("doc-tools").innerHTML = docTools();
    postPreview();
    if (editor.kind === "script" && !isPost()) scriptTextChanged();
  };
  text.addEventListener("input", markDirty);
  title.addEventListener("input", markDirty);
  const md = document.getElementById("md-preview");
  md?.addEventListener("dblclick", event => { if (!event.target.closest("mark")) actions["editor-view"]("edit"); });
  md?.addEventListener("click", event => { const mark = event.target.closest("mark[data-comment]"); if (mark) { editor.sideTab = "comments"; rerender(); flashComment(mark.dataset.comment); } });
  if (md && kind === "script") highlightComments(md);
  if (editor.sideTab === "preview" && editor.design) mountPlayer(document.getElementById("script-player"), { ...scriptPayload(), options: { autoplay: false, loop: true, captions: true } });
  postPreview();
  restoreFocus(focus);
}

// One button finishes editing: Save when there are changes (then shows the preview), Done when there are none.
// Ctrl+S saves without leaving the editor.
function docTools() {
  const comment = editor.kind === "script" ? `<button class="btn ghost small" data-action="add-comment" data-keep-selection title="Select text first to comment on it">${icon("comment")}Comment</button>` : "";
  const save = `<button class="btn small" data-action="save-doc">${icon("check")}Save</button>`;
  if (editor.view === "preview" && canPreview()) return comment + (editor.dirty ? save : "") + `<button class="btn ghost small" data-action="editor-view" data-id="edit">${icon("edit")}Edit</button>`;
  if (editor.dirty) return comment + save;
  return comment + (canPreview() ? `<button class="btn ghost small" data-action="editor-view" data-id="preview">${icon("check")}Done</button>` : "");
}

function scriptHeader() {
  const d = editor.data, c = channelById(d.channel) || { name: d.channel }, story = storyById(d.story);
  return `<div class="script-meta"><span>For <b><a href="${channelHref(d.channel)}">${esc(c.name)}</a></b>${[c.platform, c.language].filter(Boolean).map(x => " · " + esc(x)).join("")}</span>
    <span>From <a href="${base()}/stories">${esc(projectName())}</a> → ${story ? `<a href="${storyHref(story.id)}">${esc(story.title)}</a>` : "a deleted story"}</span></div>`;
}

function storySide() {

    <section><h4>Findings <button class="btn ghost small" data-action="attach">${icon("plus")}Add</button></h4>
    ${attached.map(f => `<div class="ref">
        <div class="ref-top"><b>${esc(f.title)}</b><button class="icon-btn" data-action="detach" data-id="${esc(f.id)}" aria-label="Detach ${esc(f.title)}" title="Detach">${icon("x")}</button></div>
        ${f.summary ? `<p>${esc(f.summary)}</p>` : ""}
        <ul>${f.sources.map(src => `<li><a href="${safeUrl(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.publisher || host(src.url))}${src.title ? ": " + esc(src.title) : ""}</a></li>`).join("")}</ul>
      </div>`).join("")}</section>`;
}

const wpm = () => editor.voice?.words_per_minute || 160;
const scriptScenes = () => parseScenes(docText(), wpm());
const scriptPayload = () => ({ design: editor.design, scenes: scriptScenes() });
function timingLabel() {
  const total = scriptScenes().reduce((sum, x) => sum + x.duration, 0), target = editor.voice?.length_seconds;
  return total ? `${fmtTime(total)}${target ? ` of ${fmtTime(target)}` : ""}` : "";
}
function scriptTextChanged() {

  const beats = document.getElementById("beat-list"); if (beats) beats.innerHTML = beatList();
  const view = editor;
  if (view.sideTab === "preview") debounce("script-preview", 500, () => { if (editor === view && route().id === view.data.id && view.sideTab === "preview") playerReload(view.design, scriptScenes()); });
}

const SCORE_LABELS = [["hook", "Hook"], ["clarity", "Clarity"], ["retention", "Retention"], ["specificity", "Specificity"], ["voice", "Voice"], ["accuracy", "Accuracy"]];
function scriptSide() {
  const d = editor.data, open = openComments(d);
  const tabs = isPost() ? [] : [["preview", "Preview"], ["hooks", "Hooks"], ["quality", "Quality"], ["comments", "Comments"]];
  const badge = { hooks: (d.angles || []).length, comments: open.length, quality: d.review ? avgScore(d.review).toFixed(1) : "" };
  const tab = isPost() ? "comments" : editor.sideTab || "preview";
  return `<div class="side-actions"><button class="btn primary" data-action="write-draft">${icon("spark")}${open.length ? `Revise with ${plural(open.length, "comment")}` : "Write draft"}</button></div>

function beatList() {
  const scenes = scriptScenes();
  if (!scenes.length) return `<p class="muted small">Write the script as beats (## headings) with Visual: lines, and each beat plays here in the channel's look.</p>`;
  const warnings = [];
  scenes.forEach(x => { if (x.duration > 12) warnings.push(`“${x.beat}” runs ${x.duration}s. Split it, or the screen sits still too long.`); });
  if (scenes.at(-1).type !== "end") warnings.push("The last beat isn't an end scene.");
  const total = scenes.reduce((sum, x) => sum + x.duration, 0), target = editor.voice?.length_seconds;
  if (target && Math.abs(total - target) > target * 0.10) warnings.push(`${fmtTime(total)} is ${total > target ? "over" : "under"} the ${fmtTime(target)} target.`);
  return scenes.map((x, i) => `<button type="button" class="beat" data-action="seek-beat" data-id="${i}" data-beat-index="${i}">
      <span class="beat-type">${esc(x.type)}</span><b>${esc(x.beat)}</b><span class="muted">${x.duration}s</span></button>`).join("")
    + warnings.map(w => `<p class="beat-warn">${esc(w)}</p>`).join("");
}

// Beat scripts: Visual, Text, and Note lines show as cues under the spoken lines, not as more voiceover.
function scriptMarkdown(src) {
  return markdown(src).replace(/(^|<br>|<p>)\s*(?:<em>|<strong>)?(Visual|Text|Note)(?:<\/em>|<\/strong>)?\s*:\s*(?:<\/em>|<\/strong>)?\s*(.*?)(?=<br>|<\/p>)/gi,
    (_, lead, label, rest) => `${lead}<span class="cue cue-${label.toLowerCase()}"><b>${label}</b>${rest}</span>`);
}

// Marks each open comment's quote in the rendered preview. Quotes spanning formatting are listed but not marked.
function highlightComments(md) {
  for (const c of openComments(editor.data)) {
    if (!c.quote || c.position < 0) continue;
    const plain = c.quote.replace(/[*_~`]/g, "").replace(/^#+\s*/gm, "").split("\n").map(x => x.trim()).find(Boolean);
    if (!plain) continue;
    const walker = document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      const at = node.data.indexOf(plain);
      if (at < 0 || node.parentElement.closest("mark")) continue;
      const range = document.createRange();
      range.setStart(node, at); range.setEnd(node, at + plain.length);
      const mark = Object.assign(document.createElement("mark"), { title: c.body });
      mark.dataset.comment = c.id;
      range.surroundContents(mark);
      break;
    }
  }
}

function flashComment(id) {
  const card = document.querySelector(`.comment[data-comment="${CSS.escape(id)}"]`);
  if (!card) return;
  card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
}

// The selected passage as it is in the saved text: from the editor directly, or matched back from the preview.
function selectedQuote() {
  const raw = docText(), area = document.getElementById("doc-text");
  if (area && !area.hidden && area.selectionStart !== area.selectionEnd) {
    const picked = raw.slice(area.selectionStart, area.selectionEnd), lead = picked.length - picked.trimStart().length;
    return picked.trim() ? { quote: picked.trim(), offset: area.selectionStart + lead } : null;
  }
  const selection = getSelection(), md = document.getElementById("md-preview");
  if (!md || !selection.rangeCount || selection.isCollapsed || !md.contains(selection.anchorNode)) return null;
  const picked = selection.toString().trim();
  if (!picked) return null;
  const exact = raw.indexOf(picked);
  if (exact >= 0) return { quote: picked, offset: exact };
  // The preview hides markdown, so allow formatting characters between the selected words.
  const reEsc = c => c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const pattern = picked.split(/\s+/).map(word => [...word].map(reEsc).join("[*_~`]*")).join("[\\s*_~`#>\\-]+");
  const match = new RegExp(pattern).exec(raw);
  return match ? { quote: match[0], offset: match.index } : { quote: picked, offset: null };
}

// Enough markdown for scripts and notes. Single newlines stay line breaks, and [1]-style citations are set small.
function markdown(src) {
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  const bullet = /^\s*([-*+]|\d+[.)])\s+(.*)$/, rule = /^\s*([-*_])(\s*\1){2,}\s*$/, tableSep = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  const isTable = i => lines[i].includes("|") && i + 1 < lines.length && tableSep.test(lines[i + 1]) && lines[i + 1].includes("-");
  const starts = i => /^(#{1,6}\s|```|>)/.test(lines[i]) || bullet.test(lines[i]) || rule.test(lines[i]) || isTable(i);
  const cells = row => row.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
  const out = [];
  let i = 0, m;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (/^```/.test(line)) {
      const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
    } else if ((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) {
      out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++;
    } else if (rule.test(line)) {
      out.push("<hr>"); i++;
    } else if (/^>/.test(line)) {
      const quote = [];
      while (i < lines.length && /^>/.test(lines[i])) quote.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${markdown(quote.join("\n"))}</blockquote>`);
    } else if ((m = line.match(bullet))) {
      const ordered = /\d/.test(m[1]), items = [];
      while (i < lines.length && lines[i].trim()) {
        const b = lines[i].match(bullet);
        if (b && /\d/.test(b[1]) === ordered) items.push(b[2]);
        else if (!b && items.length && !starts(i)) items[items.length - 1] += "\n" + lines[i].trim();
        else break;
        i++;
      }
      const li = items.map(t => `<li>${t.split("\n").map(inline).join("<br>")}</li>`).join("");
      out.push(ordered ? `<ol start="${parseInt(m[1], 10)}">${li}</ol>` : `<ul>${li}</ul>`);
    } else if (isTable(i)) {
      const head = cells(lines[i]); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    } else {
      const para = [lines[i++]];
      while (i < lines.length && lines[i].trim() && !starts(i)) para.push(lines[i++]);
      out.push(`<p>${para.map(inline).join("<br>")}</p>`);
    }
  }
  return out.join("");
}

function inline(text) {
  const codes = [];
  return esc(text)
    .replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/\*\*(?=\S)(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^\w])__(?=\S)(.+?)__(?!\w)/g, "$1<strong>$2</strong>")
    .replace(/(^|[^\w*])\*(?=\S)([^*]+?)\*(?![\w*])/g, "$1<em>$2</em>")
    .replace(/(^|[^\w])_(?=\S)([^_]+?)_(?!\w)/g, "$1<em>$2</em>")
    .replace(/~~(?=\S)(.+?)~~/g, "<s>$1</s>")
    .replace(/\[(\d+(?:\s*[,–-]\s*\d+)*)\](?!\()/g, '<span class="cite">[$1]</span>')
    .replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${codes[n]}</code>`);
}

function whatsapp(text) {
  return esc(text)
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<b>$2</b>")
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?:;]|$)/g, "$1<i>$2</i>")
    .replace(/(^|[\s(])~([^~\n]+)~(?=[\s).,!?:;]|$)/g, "$1<s>$2</s>")
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

async function saveDoc(finish = false) {
  if (!editor || !editor.dirty) return true;
  const view = editor, project = PROJECT, key = EDITORS[view.kind].key;
  const { id, title, version } = view.data, text = view.data[key];
  try {
    const fresh = await api("PUT", `p/${enc(project)}/${EDITORS[view.kind].path(id)}`, { title, [key]: text, version });
    const unchanged = view.data.title === title && view.data[key] === text;
    view.data = unchanged ? fresh : { ...fresh, title: view.data.title, [key]: view.data[key] };
    view.dirty = !unchanged; view.remoteChanged = false;
    if (finish && unchanged && editor === view && canPreview()) view.view = "preview";
    if (editor === view && PROJECT === project) { await refresh(true); if (editor === view) rerender(); }
    toast("Saved");
    return unchanged && !view.dirty;
  } catch (e) {
    if (e.status === 409) { view.remoteChanged = true; if (editor === view) rerender(); }
    toast(e.message, "error");
    return false;
  }
}

// Changes that don't touch the text (links, stage, URL): keep unsaved text and adopt the new version.
async function updateMeta(changes) {
  const view = editor, project = PROJECT, key = EDITORS[view.kind].key;
  const fresh = await api("PUT", `p/${enc(project)}/${EDITORS[view.kind].path(view.data.id)}`, changes);
  view.data = view.dirty ? { ...fresh, title: view.data.title, [key]: view.data[key] } : fresh;
  if (editor === view && PROJECT === project) { await refresh(true); if (editor === view) rerender(); }
}

async function reloadComments() {
  const view = editor, project = PROJECT;
  const fresh = await api("GET", `p/${enc(project)}/${EDITORS.script.path(view.data.id)}`);
  view.data.comments = fresh.comments;
  if (editor === view && PROJECT === project) { await refresh(true); if (editor === view) rerender(); }
}

const PLATFORMS = ["YouTube", "YouTube Shorts", "Instagram Reels", "TikTok", "WhatsApp channel", "LinkedIn", "X"];
function channelDialog(channel) {
  const c = channel || { kind: "video", language: "English", platform: "", audience: "", format: "" };
  openDialog({
    title: channel ? "Edit channel" : "New channel", sub: "Every project can send scripts here. Scripts follow the channel's language and format.",
    body: field("Name", `<input name="name" value="${esc(c.name || "")}" placeholder="e.g. Explained in 90s" required>`)
      + field("Platform", `<input name="platform" value="${esc(c.platform)}" list="platforms" placeholder="e.g. YouTube Shorts"><datalist id="platforms">${PLATFORMS.map(x => `<option value="${x}">`).join("")}</datalist>`)
      + field("Type", `<select name="kind"><option value="video" ${c.kind === "video" ? "selected" : ""}>Video script</option><option value="post" ${c.kind === "post" ? "selected" : ""}>Text post (WhatsApp, LinkedIn, X)</option></select>`)
      + field("Language", `<select name="language">${LANGUAGES.map(l => `<option ${c.language === l ? "selected" : ""}>${l}</option>`).join("")}${LANGUAGES.includes(c.language) ? "" : `<option selected>${esc(c.language)}</option>`}</select>`,
          "Hindi is always written in Devanagari. Hinglish mixes Hindi (Devanagari) with English terms, e.g. “HDPE resin के rates बढ़े”.")
      + field("Audience", `<input name="audience" value="${esc(c.audience)}" placeholder="Who watches, and what they already know">`)
      + field("Format", `<textarea name="format" rows="7" placeholder="${channel ? "" : "Leave empty to start from the default format for this type"}">${esc(c.format)}</textarea>`, "Length, structure, tone, visuals. Your agent follows this when writing."),
    submit: channel ? "Save" : "Create channel",
    onOpen: form => form.platform.oninput = () => { if (/whatsapp|linkedin|^x$/i.test(form.platform.value.trim())) form.kind.value = "post"; },
    onSubmit: async form => {
      const values = Object.fromEntries(new FormData(form));
      if (channel) await api("PUT", "channels/" + enc(channel.id), values);
      else {
        const created = await api("POST", "channels", values);
        await refreshGlobal(true);
        setupChannel = created.id;
        location.hash = `${channelHref()}/${enc(created.id)}/${created.kind === "post" ? "voice" : "look"}`;
        return;
      }
      await refreshGlobal(true);
      if (editor?.kind === "story") rerender(); else render();
    },
  });
}

function topicDialog(topic) {

document.addEventListener("click", event => {
  const el = event.target.closest("[data-action]");
  if (!el || !actions[el.dataset.action] || el.tagName === "SELECT") return;
  if (el.tagName !== "INPUT") event.preventDefault();
  Promise.resolve(actions[el.dataset.action](el.dataset.id, el)).catch(e => toast(e.message, "error"));
});
// Clicking anywhere on a card (outside its own links and controls) does the card's main action.
function cardAction(event) {
  const card = event.target.closest("[data-card]");
  if (!card || event.target.closest("a, button, input, select, textarea, label, summary") || getSelection().toString()) return;
  if (event.type === "keydown") { if (event.key !== "Enter" || event.target !== card) return; event.preventDefault(); }
  Promise.resolve(actions[card.dataset.card](card.dataset.id, card)).catch(e => toast(e.message, "error"));
}
document.addEventListener("click", cardAction);
document.addEventListener("keydown", cardAction);
document.addEventListener("change", event => {
  const el = event.target.closest('select[data-action]');
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el.dataset.id, el);
});
// Clicking Comment must not clear the text the user selected in the preview.
document.addEventListener("mousedown", event => { if (event.target.closest("[data-keep-selection]")) event.preventDefault(); });
document.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key === "s" && editor) { event.preventDefault(); saveDoc(); }
});
async function loadProjects() {

  el.innerHTML = `<button class="switch-btn" data-action="toggle-switcher" aria-haspopup="true">${esc(projectName() || "Choose project")}${icon("chevron")}</button>
    <div class="menu" id="project-menu" hidden>
      <div class="menu-label">Projects</div>
      ${PROJECTS.map(c => `<a class="menu-item ${c.id === PROJECT ? "on" : ""}" href="${base(c.id)}/findings"><span>${esc(c.name)}</span>
        <span class="muted">${c.suggested_sources ? `${c.suggested_sources} new source${c.suggested_sources === 1 ? "" : "s"}` : ""}</span></a>`).join("")}
      <button class="menu-item" data-action="new-project">${icon("plus")}<span>New project</span></button>
    </div>`;
}

  let r = route();
  if (r.scope === "legacy") {
    const canonical = r.tab === "channels" ? channelHref(r.id, r.sub) : r.tab === "scripts" ? (r.id ? scriptHref(r.id, r.project) : "#/production") : base(r.project) + (r.tab ? "/" + r.tab : "") + (r.id ? "/" + enc(r.id) : "");
    history.replaceState(null, "", canonical); r = route();
  }
  const hash = location.hash;
  await refreshGlobal();
  if (location.hash !== hash) return false;
  if (r.scope === "channels" || (r.scope === "production" && !r.id)) { renderGlobalNavigation(); return true; }
  if (r.scope === "research" && !PROJECTS.length) { PROJECT = null; S = null; renderGlobalNavigation(); return true; }
  if (r.scope === "research" && !PROJECTS.some(p => p.id === r.project)) {
    const saved = RESEARCH_PROJECT || localStorage.getItem("vid-studio-project");
    const next = PROJECTS.some(p => p.id === saved) ? saved : PROJECTS[0].id;
    history.replaceState(null, "", base(next) + "/" + (r.tab || "findings")); r = route();
  }
  if (!PROJECTS.some(p => p.id === r.project)) {
    PROJECT = null; S = null; editor = null;
    renderGlobalNavigation(); renderUnavailableProject(); return false;
  }
  if (r.scope === "research") { RESEARCH_PROJECT = r.project; localStorage.setItem("vid-studio-project", r.project); }
  if (PROJECT !== r.project || !S) {
    PROJECT = r.project;
    S = null; lastStateJson = ""; selected.clear(); topicFilter = "all"; showDismissed = false; editor = null;
    const expected = location.hash;
    await refresh(true);
    if (location.hash !== expected) return false;
  }
  renderGlobalNavigation();
  return true;
}

let lastHash = location.hash;
window.addEventListener("hashchange", async () => {
  if (editor && editor.dirty && !confirm(`You have unsaved changes in this ${editor.kind}. Leave anyway?`)) { history.replaceState(null, "", lastHash); return; }
  lastHash = location.hash; editor = null;
  if (await enterProject()) render();
});

window.addEventListener("beforeunload", event => { if (editor && editor.dirty) { event.preventDefault(); event.returnValue = ""; } });

// Pick up changes your agent makes to the files while the page is open.
async function poll() {
  if (document.visibilityState === "visible" && !dialog.open && (PROJECT || ["channels", "production"].includes(route().scope))) {
    try {
      const hash = location.hash, project = PROJECT, view = editor, channel = CV;
      const current = () => hash === location.hash && project === PROJECT;
      if (view) {
        const remote = await papi("GET", EDITORS[view.kind].path(view.data.id));
        if (!current() || editor !== view) return;
        let changed = false;
        if (view.data.version && remote.version !== view.data.version) {
          if (view.dirty) { if (!view.remoteChanged) { view.remoteChanged = true; changed = true; } }
          else { view.data = remote; changed = true; toast("Updated by your agent"); }
        }
        if (view.kind === "script") {
          const metadata = ["comments", "angles", "review"];
          if (JSON.stringify(metadata.map(k => remote[k])) !== JSON.stringify(metadata.map(k => view.data[k]))) {
            for (const key of metadata) view.data[key] = remote[key];
            changed = true;
          }
          if (!isPost()) {
            const id = enc(view.data.channel);
            const [design, voice] = await Promise.all([api("GET", `channels/${id}/design`), api("GET", `channels/${id}/voice`)]);
            if (!current() || editor !== view) return;
            if (JSON.stringify([design, voice]) !== JSON.stringify([view.design, view.voice])) { Object.assign(view, { design, voice }); changed = true; }
          }
        }
        if (await refresh()) changed = true;
        if (view.kind === "script" && await refreshGlobal()) changed = true;
        if (current() && editor === view && changed) rerender();
      } else if (channel && channelRoute(channel.id)) {
        const [design, voice] = await Promise.all([api("GET", `channels/${enc(channel.id)}/design`), api("GET", `channels/${enc(channel.id)}/voice`)]);
        if (!current() || CV !== channel) return;
        let changed = false;
        for (const [resource, remote, marker] of [["design", design, "savedDesign"], ["voice", voice, "savedVoice"]]) {
          if (!timers[channelKey(channel, resource)] && !saveQueues.has(channelKey(channel, resource)) && JSON.stringify(channel[resource]) === channel[marker] && JSON.stringify(remote) !== channel[marker]) {
            channel[resource] = remote; channel[marker] = JSON.stringify(remote); changed = true;
          }
        }
        if (await refreshGlobal()) changed = true;
        if (!current() || CV !== channel) return;
        const format = channelById(channel.id)?.format || "";
        if (!timers[channelKey(channel, "fields")] && !saveQueues.has(channelKey(channel, "fields")) && JSON.stringify(channel.fields) === channel.savedFields) {
          channel.fields.format = format; channel.savedFields = JSON.stringify(channel.fields);
        }
        if (changed) renderChannel(channel.id, channel.tab);
      } else if (await (["production", "channels"].includes(route().scope) ? refreshGlobal() : PROJECT ? refresh() : Promise.resolve(false))) {
        if (!current()) return;
        const focused = document.activeElement;
        if (!focused || focused === document.body || focused.dataset.action || focused.dataset.card) render();
      }
    } catch { /* server stopped; keep the page as it is */ }
    finally { setTimeout(poll, 4000); }
  } else setTimeout(poll, 4000);
}

document.getElementById("settings-btn").insertAdjacentHTML("afterbegin", icon("gear"));
loadProjects().then(enterProject).then(ok => { if (ok) render(); poll(); })
  .catch(e => { document.getElementById("app").innerHTML = `<div class="empty"><h3>Can't reach the studio</h3><p>${esc(e.message)}. Start it with <code>studio.py serve</code>.</p></div>`; });
</script>
</body>
