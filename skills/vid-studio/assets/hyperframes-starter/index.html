<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Vid Studio — portrait motion starter</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    body { margin: 0; background: #101923; font-family: sans-serif; }
    #studio { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .slot { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="studio" data-composition-id="vid-studio" data-start="0" data-width="1080" data-height="1920" data-duration="9">
    <div id="background" style="position:absolute;inset:0;background:#101923"></div>
    <div id="hook-slot" class="clip slot" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3" data-track-index="0" data-width="1080" data-height="1920"></div>
    <div id="mechanism-slot" class="clip slot" data-composition-id="mechanism" data-composition-src="compositions/mechanism.html" data-start="3" data-duration="3" data-track-index="1" data-width="1080" data-height="1920"></div>
    <div id="takeaway-slot" class="clip slot" data-composition-id="takeaway" data-composition-src="compositions/takeaway.html" data-start="6" data-duration="3" data-track-index="2" data-width="1080" data-height="1920"></div>
  </div>
  <script>
    const main = gsap.timeline({ paused: true });
    window.__timelines["vid-studio"] = main;
  </script>
</body>
</html>
